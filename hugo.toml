baseURL = "https://sdttttt.online/"
title = "海边"
author = "sdttttt"
copyright = "© 2026, sdttttt"
locale = "zh"
DefaultContentLanguage = "zh"
hasCJKLanguage = true
enableInlineShortcodes = true
enableRobotsTXT = true
enableEmoji = true
ignoreErrors = ["error-remote-getjson"]
enableGitInfo = true
summaryLength = 100

theme = "sdttttt-paper"

[module]
  # Hugo modules required for theme component inheritance. With Hugo
  # v0.93+ the [parent] block in themes/sdttttt-paper/theme.toml is only
  # honored when both themes are loaded as modules (not as directory-based
  # themes). `theme = "sdttttt-paper"` below still drives the "main theme"
  # convention; module.imports wires up the inheritance chain.
  [[module.imports]]
    path = "sdttttt-paper"
  [[module.imports]]
    path = "hugo-paper"

[params]
  # Theme color preset: linen / wheat / gray / light
  color = "linen"
  # Date format used by hugo-paper head.html
  DateFormat = "2006年01月02日"
  # Which content sections to show on the home page list.
  # Without this, hugo-paper's list.html pulls every RegularPage and the
  # claudelog entries would crowd the home feed.
  mainSections = ["posts"]

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    identifier = "claudelog"
    name = "ClaudeLog"
    url = "/claudelog/"
    weight = 2
  [[menu.main]]
    identifier = "source"
    name = "Source"
    url = "https://github.com/sdttttt/sdttttt.github.io"
    weight = 3
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 20

[taxonomies]
tag = "tags"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = true
    hl_Lines = ""
    lineAnchors = ""
    lineNoStart = 1
    lineNos = true
    lineNumbersInTable = false
    noClasses = true
    style = "dracula"
    tabWidth = 4
