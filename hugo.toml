baseURL = "https://sdttttt.online/"
title = "海边"
author = "sdttttt"
copyright = "© 2026, sdttttt"
locale = "zh"
DefaultContentLanguage = "zh"
hasCJKLanguage = true
enableInlineShortcodes = true
enableRobotsTXT = true
enableEmoji = true
ignoreErrors = ["error-remote-getjson"]
enableGitInfo = true
summaryLength = 100

# Single theme. This used to be a thin override layer sitting on top of a
# vendored `hugo-paper`; on 2026-10-07 the two directories were merged into
# this one, upstream sync was dropped, and the theme was renamed to `self`,
# so every layout/asset the site needs now lives under themes/self/.
theme = "self"

[params]
  # Theme color preset: linen / wheat / gray / light
  color = "linen"
  # Favicon: pi.dev mark (SVG, adapts to prefers-color-scheme).
  # appleTouchIcon defaults to apple-touch-icon.png, which we also replace.
  favicon = "favicon.svg"
  # Date format used by head.html
  DateFormat = "2006年01月02日"
  # Which content sections to show on the home page list.
  # Without this, list.html pulls every RegularPage and the
  # changelog entries would crowd the home feed.
  mainSections = ["posts"]
  # Avatar: local optimized image in static/ (served at /avatar.webp).
  # Source: assets/src/avatar/avatar.jpg → `deno task optimize-images`.
  avatar = "/avatar.webp"
  name = "SDTTTTT"
  # 留空占位，顶掉主题的默认文案。注意不能写成 bio = "" —— 主题里是
  # `site.Params.bio | default (print `A personal blog by ` name)`，空字符串
  # 在 Go 模板里算 falsy，会被 default 接管又显示出来，所以这里必须是个空格。
  bio = " "
  # 首页 <meta name="description">。父主题 head.html 对非文章页走
  # `site.Params.description | default "A personal blog"`，不配就是英文兜底。
  description = "sdttttt 的个人博客：编程笔记与生活随笔。"
  # Hugo 已经在构建时用 Chroma 把代码块高亮成内联样式（见下方 [markup.highlight]
  # 的 noClasses/style），主题再挂一个 highlight.js 只会把同一份代码重新标一遍。
  # 关掉它：227 个页面各省 48KB（gzip 20KB）。
  disableHLJS = true
  # 深色模式切换按钮改用单色 SVG（869B），而不是彩色 PNG（8KB）：
  # 父主题 head.html 会 preload 它，header.html 换用 dark:invert 反色。
  monoDarkIcon = true

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 1
  # 归档页（themes/self/layouts/_default/archives.html 渲染）。
  # 页面本体的 h1 用的是 content/archives.md 的 title（中文「归档」），
  # 导航标签这里跟 Posts / Source / About 保持英文。
  [[menu.main]]
    identifier = "archive"
    name = "Archive"
    url = "/archives/"
    weight = 2
  # CHANGELOG 已隐藏，不再显示在导航菜单中
  # 如需恢复，取消下面注释
  # [[menu.main]]
  #   identifier = "changelog"
  #   name = "CHANGELOG"
  #   url = "/changelog/"
  #   weight = 2
  [[menu.main]]
    identifier = "source"
    name = "Source"
    url = "https://github.com/sdttttt/sdttttt.github.io"
    weight = 3
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 20

# 站内搜索需要一份构建期索引：首页额外产出一份 /searchindex.json
# （模板见 themes/self/layouts/index.json），/search/ 页在前端
# 拉取它做过滤。下面覆盖的是 Hugo 内置的 JSON 输出格式，字段与内置一致，
# 只改文件名（index.json → searchindex.json）；只有 home 输出 JSON。
[outputs]
  home = ["HTML", "RSS", "JSON"]

[outputFormats.JSON]
  baseName = "searchindex"
  mediaType = "application/json"
  isPlainText = false
  # 它不是「本页的另一种表现」，别让 head.html 的 AlternativeOutputFormats
  # 循环把它当成订阅源写进 <link rel="alternate">。
  notAlternative = true

[taxonomies]
tag = "tags"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = true
    hl_Lines = ""
    lineAnchors = ""
    lineNoStart = 1
    lineNos = true
    lineNumbersInTable = false
    noClasses = true
    style = "dracula"
    tabWidth = 4
