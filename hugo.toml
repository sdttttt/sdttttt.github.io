baseURL = "https://sdttttt.online/"
title = "海边"
author = "sdttttt"
copyright = "© 2026, sdttttt"
locale = "zh"
DefaultContentLanguage = "zh"
hasCJKLanguage = true
enableRobotsTXT = true
enableEmoji = true
enableGitInfo = true
summaryLength = 100

# Single theme. This used to be a thin override layer sitting on top of a
# vendored `hugo-paper`; on 2026-10-07 the two directories were merged into
# this one, upstream sync was dropped, and the theme was renamed to `self`,
# so every layout/asset the site needs now lives under themes/self/.
theme = "self"

[params]
  # Theme color preset: linen / wheat / gray / light
  color = "linen"
  # Favicon: pi.dev mark (SVG, adapts to prefers-color-scheme).
  # appleTouchIcon defaults to apple-touch-icon.png, which we also replace.
  favicon = "favicon.svg"
  # Date format used by head.html
  DateFormat = "2006年01月02日"
  # Which content sections to show on the home page list.
  # Without this, list.html pulls every RegularPage and the
  # changelog entries would crowd the home feed.
  mainSections = ["posts"]
  # Avatar: local optimized image in static/ (served at /avatar.webp).
  # Source: assets/src/avatar/avatar.jpg → `deno task optimize-images`.
  avatar = "/avatar.webp"
  name = "SDTTTTT"
  # 留空占位，顶掉主题的默认文案。注意不能写成 bio = "" —— 主题里是
  # `site.Params.bio | default (print `A personal blog by ` name)`，空字符串
  # 在 Go 模板里算 falsy，会被 default 接管又显示出来，所以这里必须是个空格。
  bio = " "
  # 主题侧已经不再拿它生成 <meta name="description">（那行已从 head.html 删除）。
  # 但这个参数**不是**死配置：Hugo 内建的 _internal/opengraph.html 与
  # _internal/twitter_cards.html 会回退到 site.Params.description，
  # 首页 / 标签页 / 归档页这类没有 front matter description 的页面靠它拿到
  # og:description / twitter:description（删掉后这些页面的分享卡片就没有描述）。
  description = "sdttttt 的个人博客：编程笔记与生活随笔。"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 1
  # 归档页（themes/self/layouts/_default/archives.html 渲染）。
  # 页面本体的 h1 用的是 content/archives.md 的 title（中文「归档」），
  # 导航标签这里跟 Posts / Source / About 保持英文。
  [[menu.main]]
    identifier = "archive"
    name = "Archive"
    url = "/archives/"
    weight = 2
  # 站内搜索（content/search.md 的 `layout: search` + themes/self/layouts/_default/search.html
  # 渲染，索引是构建期产出的 /searchindex.json）。
  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 3
  # CHANGELOG 已隐藏，不再显示在导航菜单中
  # 如需恢复，取消下面注释
  # [[menu.main]]
  #   identifier = "changelog"
  #   name = "CHANGELOG"
  #   url = "/changelog/"
  #   weight = 2
  [[menu.main]]
    identifier = "source"
    name = "Source"
    url = "https://github.com/sdttttt/sdttttt.github.io"
    weight = 4
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 20

# 站内搜索需要一份构建期索引：首页额外产出一份 /searchindex.json
# （模板见 themes/self/layouts/index.json），/search/ 页在前端
# 拉取它做过滤。下面覆盖的是 Hugo 内置的 JSON 输出格式，字段与内置一致，
# 只改文件名（index.json → searchindex.json）；只有 home 输出 JSON。
#
# RSS 已全面关闭：Hugo 默认会给 home / section / taxonomy / term 都加 RSS 输出，
# 所以只写 `home` 关不干净（tags/*/index.xml、changelog/index.xml 就是这么来的），
# 必须把四类页面逐个列出来。将来要恢复，把 "RSS" 加回 home，
# 并删掉 section / taxonomy / term 这三行即可。
[outputs]
  home = ["HTML", "JSON"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[outputFormats.JSON]
  baseName = "searchindex"
  mediaType = "application/json"
  isPlainText = false
  # 它不是「本页的另一种表现」，别让别处
  # （比如未来的 alternative-output <link>）把它当成订阅源。
  notAlternative = true

[taxonomies]
tag = "tags"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = true
    hl_Lines = ""
    lineAnchors = ""
    lineNoStart = 1
    lineNos = true
    lineNumbersInTable = false
    noClasses = true
    style = "dracula"
    tabWidth = 4
