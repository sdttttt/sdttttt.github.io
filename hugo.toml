baseURL = "https://sdttttt.online/"
title = "海边"
author = "sdttttt"
copyright = "© 2026, sdttttt"
locale = "zh"
DefaultContentLanguage = "zh"
hasCJKLanguage = true
enableInlineShortcodes = true
enableRobotsTXT = true
enableEmoji = true
ignoreErrors = ["error-remote-getjson"]
enableGitInfo = true
summaryLength = 100

# Theme components: sdttttt-paper is looked up first, hugo-paper second.
# Layouts/assets present in the first theme shadow the second's same-path
# files; everything else falls through (e.g. head.html, list.html come from
# hugo-paper). Order matters — do not swap.
theme = ["sdttttt-paper", "hugo-paper"]

[params]
  # Theme color preset: linen / wheat / gray / light
  color = "linen"
  # Favicon: pi.dev mark (SVG, adapts to prefers-color-scheme).
  # appleTouchIcon defaults to apple-touch-icon.png, which we also replace.
  favicon = "favicon.svg"
  # Date format used by hugo-paper head.html
  DateFormat = "2006年01月02日"
  # Which content sections to show on the home page list.
  # Without this, hugo-paper's list.html pulls every RegularPage and the
  # claudelog entries would crowd the home feed.
  mainSections = ["posts"]
  # Avatar: local optimized image in static/ (served at /avatar.webp).
  # Source: assets/src/avatar/avatar.jpg → `deno task optimize-images`.
  avatar = "/avatar.webp"
  name = "SDTTTTT"
  # Hugo 已经在构建时用 Chroma 把代码块高亮成内联样式（见下方 [markup.highlight]
  # 的 noClasses/style），主题再挂一个 highlight.js 只会把同一份代码重新标一遍。
  # 关掉它：227 个页面各省 48KB（gzip 20KB）。
  disableHLJS = true

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 1
  # CHANGELOG 已隐藏，不再显示在导航菜单中
  # 如需恢复，取消下面注释
  # [[menu.main]]
  #   identifier = "changelog"
  #   name = "CHANGELOG"
  #   url = "/changelog/"
  #   weight = 2
  [[menu.main]]
    identifier = "source"
    name = "Source"
    url = "https://github.com/sdttttt/sdttttt.github.io"
    weight = 3
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 20

[taxonomies]
tag = "tags"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = true
    hl_Lines = ""
    lineAnchors = ""
    lineNoStart = 1
    lineNos = true
    lineNumbersInTable = false
    noClasses = true
    style = "dracula"
    tabWidth = 4
