name = "sdttttt-paper"
license = "MIT"
licenselink = "https://github.com/sdttttt/sdttttt.github.io/blob/master/themes/sdttttt-paper/LICENSE"
description = "sdttttt's personal fork of hugo-paper"
homepage = "https://sdttttt.online/"
tags = ["Responsive", "Simple", "Clean", "Light", "Blog"]
features = ["Responsive", "One Column", "Blog"]
min_version = "0.100.0"

[author]
  name = "sdttttt"
  homepage = "https://sdttttt.online/about/"

# No [parent] block: this theme is combined with hugo-paper through the
# site's `theme = ["sdttttt-paper", "hugo-paper"]` list in hugo.toml, where
# the first theme's same-path layouts/assets shadow the second's. [parent]
# is a Hugo Modules concept and is a no-op under directory-based theme lists.
