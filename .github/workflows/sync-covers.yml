name: Sync Cover Images

on:
  workflow_dispatch:
  schedule:
    # 每周一 03:17 UTC 自动清理
    - cron: '17 3 * * 1'

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Compile scripts
        run: npx tsc -p tsconfig.scripts.json

      - name: Remove orphan cover images
        run: node scripts/dist/sync-covers.js

      - name: Commit and push changes
        run: |
          node scripts/dist/git-commit-push.js --message "chore(assets): remove orphan cover images"
