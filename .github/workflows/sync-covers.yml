name: Sync Cover Images

on:
  workflow_dispatch:
  schedule:
    # 每周一 03:17 UTC 自动清理
    - cron: '17 3 * * 1'

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Remove orphan cover images
        run: bun scripts/sync-covers.ts

      - name: Commit and push changes
        run: |
          bun scripts/git-commit-push.ts --message "chore(assets): remove orphan cover images"
