name: Sync Cover Images

on:
  workflow_dispatch:
  schedule:
    # 每周一 03:17 UTC 自动清理
    - cron: '17 3 * * 1'

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Remove orphan cover images
        run: deno task sync-covers

      - name: Commit and push changes
        run: >
          deno run -A scripts/git-commit-push.ts
          --message "chore(assets): remove orphan cover images"