name: Update PaperMod Theme

on:
  schedule:
    # 每周一早上 8 点 UTC 运行
    - cron: '0 8 * * 1'
  # 允许手动触发
  workflow_dispatch:

permissions:
  contents: write
  actions: write # 更新后触发 deploy.yml 的 workflow_dispatch

jobs:
  update-submodule:
    runs-on: ubuntu-latest
    # 跳过 github-actions[bot] 的触发：避免子模块更新 commit 触发新一轮自更新
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update PaperMod submodule
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git submodule update --remote themes/PaperMod

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      # 推送前先用与 deploy 相同的固定版本 Hugo 冒烟构建：
      # 上游 breaking 改动直接失败在本工作流，不会落进 master
      - name: Setup Hugo
        if: steps.check.outputs.has_changes == 'true'
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.161.1'
          extended: true

      - name: Smoke build
        if: steps.check.outputs.has_changes == 'true'
        run: hugo --minify

      - name: Commit and push changes
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git add themes/PaperMod
          git commit -m "chore: update PaperMod theme to latest version"
          git push

      # GITHUB_TOKEN 的 push 不会触发任何 workflow，这里显式 dispatch 部署，
      # 否则主题更新要等下一次人工 push 才会上线
      - name: Trigger deploy
        if: steps.check.outputs.has_changes == 'true'
        run: gh workflow run deploy.yml --ref master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
