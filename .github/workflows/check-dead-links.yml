name: Check Dead Links

# 每周一次 + 内容变化时检查外链，跑什么与「失败怎么处理」都由 scripts/check-dead-links.ts 决定。
# 死链不阻塞部署（外链会抖），但必须有可见痕迹：CI 里脚本会写 ::warning:: 与 job summary。
on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 0'
  push:
    branches:
      - master
      - main
    paths:
      - 'content/**'
      - 'scripts/check-dead-links.ts'
      - 'package.json'
      - '.github/workflows/check-dead-links.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.22.0'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # check-dead-links 只依赖 node: 内置模块，不需要 pnpm install
      - name: Check dead links
        run: pnpm run check-dead-links
