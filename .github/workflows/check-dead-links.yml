name: Check Dead Links

on:
  workflow_dispatch:
  schedule:
    # 每周日 02:17 UTC 检查一次
    - cron: '17 2 * * 0'
  push:
    branches: [master, main]
    paths:
      - 'content/**'
      - 'scripts/check-dead-links.ts'
      - '.github/workflows/check-dead-links.yml'

jobs:
  check:
    # 跳过 github-actions[bot] 的 push：避免 auto-fix commit 触发新一轮检查
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check dead links
        run: deno task check-dead-links || true