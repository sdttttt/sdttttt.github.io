name: Hugo on GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - master

# 同一时刻只允许一个部署，后到的 push 取消进行中的旧构建，
# 避免旧 artifact 后完成、覆盖新内容的乱序。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # 仅跳过 github-actions[bot] 的 push：避免 auto-fix commit 触发新一轮自部署。
    # workflow_dispatch 放行 bot：sync-covers / update-papermod 推完改动后会用
    # gh workflow run 显式触发部署（GITHUB_TOKEN 的 push 本就不会触发任何 workflow，
    # 不放行的话这些维护改动要等下一次人工 push 才上线）。
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    permissions:
      contents: write # 自动修复结果需要提交回仓库
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0 # pull --rebase 需要完整历史

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # deno task format-markdown 现在就是 prettier 命令本身（旧的 wrapper 脚本已删）；
      # 用 deno install 替代 npm install -g，prettier 落在 ~/.deno/bin/(与 deno 同目录,已在 PATH),省掉 setup-node。
      - name: Install Prettier
        run: deno install -g -A npm:prettier@3.9.6

      - name: Rename posts
        run: deno task rename-posts

      - name: Format Markdown files
        run: deno task format-markdown

      # 发布前最后门槛：front matter 缺字段的就地失败，不带病构建上线。
      - name: Validate posts
        run: deno task validate-posts

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # 固定版本，避免上游 breaking change 无预警打挂部署；升级时手动改这里，
          # 并与 update-papermod.yml 的冒烟构建保持一致
          hugo-version: '0.161.1'
          extended: true

      - name: Build
        run: hugo --minify

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      # 放在 artifact 上传之后：万一撞上并发 push 导致失败，也不阻塞本次部署。
      # 这里原本是 scripts/git-commit-push.ts（按 staged 内容自动分类 commit message），
      # 现已精简成内联 shell：提交信息统一为 chore: auto-fix content。
      - name: Commit auto-fix results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: auto-fix content"
          git pull --rebase
          git push

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4