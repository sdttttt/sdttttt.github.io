name: Hugo on GitHub Pages

# 这个文件只声明「GitHub 强制依赖的东西」：触发条件、权限、第三方 action、
# 工具链安装、artifact 上传 / Pages 部署。
# 所有实际逻辑都在 bin/*.sh 里，本地跑的是同一份脚本 —— 见 AGENTS.md「工作流」。
on:
  workflow_dispatch:
  push:
    branches:
      - master

# 同一时刻只允许一个部署：后到的 push 取消进行中的旧构建，
# 避免旧的 artifact 后完成、把新内容盖回去。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # 冗余保险：GITHUB_TOKEN 发起的 push 本来就不会触发 workflow，
    # 但哪天换成 PAT，bin/publish-autofix.sh 的推回就会自触发一轮。
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    permissions:
      contents: write # bin/publish-autofix.sh 把修复结果提交回仓库
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # publish-autofix.sh 里的 git pull --rebase 需要完整历史

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          # 与本地 vendored 的 .tools/deno 对齐，见 AGENTS.md
          deno-version: '2.9.5'

      # 工具链安装：prettier 用版本钉死的 npm 包，本地 .tools/deno/bin/prettier 是同一版本
      - name: Install Prettier
        run: deno install -g -A npm:prettier@3.9.6

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # 固定版本：上游 breaking change 不该在无人知晓时打挂部署
          hugo-version: '0.161.1'
          extended: true

      # 规范化 + 校验：文件名 / Markdown / front matter / 单测 / 产物新鲜度
      - name: Preflight
        run: ./bin/preflight.sh --fix

      - name: Build
        run: ./bin/build.sh

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './public'

      # 放在后台上传之后：万一这里撞上并发 push 失败，也不影响本次部署已经完成的部分
      - name: Commit auto-fix results
        run: ./bin/publish-autofix.sh

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
