name: Hugo on GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - master

# 同一时刻只允许一个部署，后到的 push 取消进行中的旧构建，
# 避免旧 artifact 后完成、覆盖新内容的乱序。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # 仅跳过 github-actions[bot] 的 push：避免 auto-fix commit 触发新一轮自部署。
    # workflow_dispatch 放行 bot：sync-covers / update-papermod 推完改动后会用
    # gh workflow run 显式触发部署（GITHUB_TOKEN 的 push 本就不会触发任何 workflow，
    # 不放行的话这些维护改动要等下一次人工 push 才上线）。
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    permissions:
      contents: write # 自动修复结果需要提交回仓库
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0 # pull --rebase 需要完整历史

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # format-markdown.ts 通过 shell 调用全局 prettier；用 deno install 替代 npm install -g，
      # prettier wrapper 落在 ~/.deno/bin/(与 deno 同目录,已在 PATH),省掉 setup-node。
      - name: Install Prettier
        run: deno install -g -A npm:prettier@3.9.6

      - name: Optimize images
        run: deno task optimize-images --dir assets/images --variants-only --width 1200

      - name: Rename posts
        run: deno task rename-posts

      # 先生成封面并注入 front matter，再交给 prettier 统一格式化，
      # 这样注入的 YAML 不会留下待格式化的残留。
      - name: Generate covers and inject front matter
        run: deno run -A scripts/gen-covers.ts --all --inject-fm

      - name: Format Markdown files
        run: deno task format-markdown

      # 发布前最后门槛：front matter 缺字段 / 封面路径失效的内容就地失败，
      # 不带病构建上线。放在 gen-covers 之后，注入的 cover 路径已落盘。
      - name: Validate posts
        run: deno task validate-posts

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # 固定版本，避免上游 breaking change 无预警打挂部署；升级时手动改这里，
          # 并与 update-papermod.yml 的冒烟构建保持一致
          hugo-version: '0.161.1'
          extended: true

      - name: Build
        run: hugo --minify

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      # 放在 artifact 上传之后：万一撞上并发 push 导致失败，也不阻塞本次部署
      # git-commit-push.ts 会按 staged 内容自动分类 commit message（rename/format/fm/...），
      # 分类失败时回退到 --message-fallback，避免静默丢失信息。
      - name: Commit auto-fix results
        run: |
          deno run -A scripts/git-commit-push.ts \
            --message "chore: auto-fix content" \
            --message-fallback "chore: auto-fix content"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4