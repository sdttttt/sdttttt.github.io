name: Test Scripts

# CI 只声明触发条件与工具链，跑什么由 bin/test.sh 决定（本地同一个脚本）。
on:
  push:
    branches:
      - master
      - main
    paths:
      - 'scripts/**'
      - 'bin/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/test-scripts.yml'
  pull_request:
    branches:
      - master
      - main
    paths:
      - 'scripts/**'
      - 'bin/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.22.0'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # shell 语法检查 + vitest
      - name: Run tests
        run: ./bin/test.sh
