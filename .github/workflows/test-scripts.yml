name: Test Scripts

on:
  push:
    branches: [master, main]
    paths:
      - 'scripts/**'
      - '.github/workflows/test-scripts.yml'
      - 'package.json'
  pull_request:
    branches: [master, main]
    paths:
      - 'scripts/**'
      - 'package.json'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test
