name: Test Scripts

# CI 只声明触发条件与工具链，跑什么由 bin/test.sh 决定（本地同一个脚本）。
on:
  push:
    branches:
      - master
      - main
    paths:
      - 'scripts/**'
      - 'bin/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/test-scripts.yml'
  pull_request:
    branches:
      - master
      - main
    paths:
      - 'scripts/**'
      - 'bin/**'
      - 'package.json'

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      # shell 语法检查 + bun test
      - name: Run tests
        run: ./bin/test.sh
