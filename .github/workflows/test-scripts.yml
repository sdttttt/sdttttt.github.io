name: Test Scripts

# CI 只声明触发条件与工具链，跑什么由 bin/test.sh 决定（本地同一个脚本）。
on:
  push:
    branches:
      - master
      - main
    paths:
      - 'scripts/**'
      - 'bin/**'
      - 'deno.json'
      - '.github/workflows/test-scripts.yml'
  pull_request:
    branches:
      - master
      - main
    paths:
      - 'scripts/**'
      - 'bin/**'
      - 'deno.json'

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.5'

      # shell 语法检查 + deno test
      - name: Run tests
        run: ./bin/test.sh
