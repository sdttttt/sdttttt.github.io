name: Test Scripts

on:
  push:
    branches: [master, main]
    paths:
      - 'scripts/**'
      - 'deno.json'
      - '.github/workflows/test-scripts.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'scripts/**'
      - 'deno.json'

jobs:
  test:
    # 跳过 github-actions[bot] 的 push：避免 auto-fix commit 触发新一轮测试
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run tests
        run: deno task test
