name: Test Scripts

on:
  push:
    branches: [master, main]
    paths:
      - 'scripts/**'
      - '.github/workflows/test-scripts.yml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [master, main]
    paths:
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Compile scripts
        run: npx tsc -p tsconfig.scripts.json

      - name: Run tests
        run: node --test scripts/dist/__tests__/*.js
