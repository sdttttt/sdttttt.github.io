name: Generate Cover Images

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - 'content/posts/**.md'

jobs:
  gen-covers:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Generate covers and inject front matter
        run: bun scripts/gen-covers.ts --all --inject-fm

      - name: Commit and push changes
        run: |
          bun scripts/git-commit-push.ts --message "feat(assets): auto-generate cover images"
