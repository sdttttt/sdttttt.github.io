name: Validate Posts

# PR 与 push 时的 front matter 快检，跑什么由 scripts/validate-posts.ts 决定。
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths:
      - 'content/posts/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/validate-posts.yml'
  pull_request:
    branches:
      - master
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.22.0'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # validate-posts 只依赖 node: 内置模块，不需要 pnpm install
      - name: Validate posts
        run: pnpm run validate-posts
