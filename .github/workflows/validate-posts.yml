name: Validate Posts

# PR 与 push 时的 front matter 快检，跑什么由 scripts/validate-posts.ts 决定。
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths:
      - 'content/posts/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/validate-posts.yml'
  pull_request:
    branches:
      - master
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Validate posts
        run: bun run validate-posts
