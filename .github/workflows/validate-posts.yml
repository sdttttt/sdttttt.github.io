name: Validate Posts

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - 'content/posts/**'
      - 'scripts/**'
      - 'deno.json'
      - '.github/workflows/validate-posts.yml'
  pull_request:
    branches: [master, main]

jobs:
  validate:
    # 跳过 github-actions[bot] 的 push：避免 auto-fix commit 触发新一轮校验
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate posts
        run: deno task validate-posts