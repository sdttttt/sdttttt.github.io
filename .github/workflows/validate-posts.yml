name: Validate Posts

# PR 与 push 时的 front matter 快检，跑什么由 scripts/validate-posts.ts 决定。
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths:
      - 'content/posts/**'
      - 'scripts/**'
      - 'deno.json'
      - '.github/workflows/validate-posts.yml'
  pull_request:
    branches:
      - master
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.5'

      - name: Validate posts
        run: deno task validate-posts
