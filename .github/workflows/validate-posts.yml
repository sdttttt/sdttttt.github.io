name: Validate Posts

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - 'content/posts/**'
      - 'scripts/**'
      - '.github/workflows/validate-posts.yml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [master, main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Compile scripts
        run: npx tsc -p tsconfig.scripts.json

      - name: Validate posts
        run: node scripts/dist/validate-posts.js
